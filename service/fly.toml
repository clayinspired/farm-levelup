# overridden by scripts/deploy-service.sh via --app "$FLY_APP"
app = "farm-levelup"
primary_region = "sin"   # change to a region near your users

[build]

[env]
  DB_PATH = "/data/plots.db"
  CACHE_PATH = "/data/elig_cache.json"
  PORT = "8080"

[[mounts]]
  source = "plotdata"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # keep one warm: a sleeping machine cold-starts on the first webhook and
  # loses the GDAL connection cache that makes repeat checks fast
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  grace_period = "5s"
  interval = "30s"
  method = "GET"
  path = "/health"
  timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
